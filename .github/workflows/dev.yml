name: Deploy Dev

on: workflow_dispatch

env:
  HOST_ELASTIC: ${{secrets.HOST_ELASTIC}}
  API_KEY: ${{secrets.API_KEY}}
  # Índices do cluster atual de dev/prod. O .env.example usa os nomes do
  # novo cluster de homologação (brcris-*); remova quando este ambiente migrar.
  INDEX_PUBLICATION: brc-nov2025-publication-09-2026
  INDEX_PERSON: brc-nov2025-person-v2
  INDEX_ORGUNIT: brc-nov2025-orgunit-v2
  INDEX_JOURNAL: brc-nov2025-journal-v2
  INDEX_PROGRAM: brc-nov2025-program-v2
  INDEX_PATENT: brc-nov2025-patent-v2
  INDEX_GROUP: brc-nov2025-group-v2
  INDEX_SOFTWARE: brc-nov2025-software-v2
  INDEX_COURSE: brc-nov2025-course
  MAIL_HOST: ${{secrets.MAIL_HOST}}
  MAIL_SENDER: ${{secrets.MAIL_SENDER}}
  MAIL_PASSWORD: ${{secrets.MAIL_PASSWORD}}
  MAIL_PORT: ${{secrets.MAIL_PORT}}
  MAIL_RECIPIENT: ${{secrets.MAIL_RECIPIENT}}
  RECAPTCHA_SECRET_KEY: ${{secrets.RECAPTCHA_SECRET_KEY}}
  BRCRIS_HOST_BASE: ${{vars.BRCRIS_HOST_BASE}}
  NEXT_BASE_PATH: ${{vars.NEXT_BASE_PATH}}


jobs:
  dev:
    runs-on: [self-hosted, Linux, x64, runner-iroxa]
    environment:
      name: dev
      url: "http://codich1.ibict.br/brcris"

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          check-latest: true

      - name: Run deploy
        run: sh scripts/deploy.sh
